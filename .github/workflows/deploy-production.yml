name: Deploy to Production

# Se ejecuta en push a master cuando cambian archivos del backend, dashboard o infra
on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - 'apps/web-dashboard/**'
      - 'infra/**'
      - '.github/workflows/deploy-production.yml'

  # Permite ejecucion manual desde GitHub UI
  workflow_dispatch:

# Solo un deploy a la vez - cancela el anterior si hay uno nuevo
concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  DEPLOY_PATH: /opt/yape-notifier
  PRODUCTION_DIR: infra/docker/environments/production

jobs:
  # ============================================
  # Job 1: Tests del backend
  # ============================================
  test-api:
    name: API Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: yape_notifier_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_pgsql, mbstring, xml, ctype, json, bcmath
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: apps/api/vendor
          key: composer-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env for testing
        run: |
          cp .env.example .env || echo "APP_NAME=YapeNotifier
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          DB_CONNECTION=pgsql
          DB_HOST=127.0.0.1
          DB_PORT=5432
          DB_DATABASE=yape_notifier_test
          DB_USERNAME=postgres
          DB_PASSWORD=testing" > .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: yape_notifier_test
          DB_USERNAME: postgres
          DB_PASSWORD: testing

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: yape_notifier_test
          DB_USERNAME: postgres
          DB_PASSWORD: testing

  # ============================================
  # Job 2: Deploy a DigitalOcean
  # ============================================
  deploy:
    name: Deploy to DigitalOcean
    runs-on: ubuntu-latest
    needs: test-api
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            echo "=========================================="
            echo "  Deploy iniciado: $(date)"
            echo "=========================================="

            cd ${{ env.DEPLOY_PATH }}

            # 1. Pull del codigo mas reciente
            echo "[1/6] Pulling latest code..."
            git fetch origin master
            git reset --hard origin/master

            # 2. Ir al directorio de produccion
            cd ${{ env.PRODUCTION_DIR }}

            # 3. Build y recrear solo los servicios que cambiaron
            echo "[2/6] Building images..."
            docker compose --env-file .env build --parallel

            # 4. Detener y recrear servicios
            echo "[3/6] Restarting services..."
            docker compose --env-file .env up -d --remove-orphans

            # 5. Ejecutar migraciones
            echo "[4/6] Running migrations..."
            docker compose --env-file .env exec -T php-fpm php artisan migrate --force

            # 6. Limpiar caches de Laravel
            echo "[5/6] Clearing caches..."
            docker compose --env-file .env exec -T php-fpm php artisan config:cache
            docker compose --env-file .env exec -T php-fpm php artisan route:cache
            docker compose --env-file .env exec -T php-fpm php artisan view:cache

            # 7. Health check
            echo "[6/6] Health check..."
            sleep 10
            if curl -sf https://api.notificaciones.space/up > /dev/null; then
              echo "API is healthy!"
            else
              echo "WARNING: API health check failed"
              docker compose --env-file .env ps
              docker compose --env-file .env logs --tail=20 php-fpm
              exit 1
            fi

            echo "=========================================="
            echo "  Deploy completado: $(date)"
            echo "=========================================="

      - name: Notify deploy success
        if: success()
        run: echo "Deploy to production completed successfully"

      - name: Notify deploy failure
        if: failure()
        run: echo "::error::Deploy to production FAILED - check logs"
