name: Android CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/android-client/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/android-client/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android-client/gradlew
        working-directory: apps/android-client

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run unit tests
        run: ./gradlew test
        working-directory: apps/android-client

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: apps/android-client

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: apps/android-client/app/build/test-results/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v3
        with:
          name: debug-apk
          path: apps/android-client/app/build/outputs/apk/debug/*.apk

  build-release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x apps/android-client/gradlew
        working-directory: apps/android-client

      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build release AAB
        run: ./gradlew bundleRelease
        working-directory: apps/android-client

      - name: Upload AAB
        uses: actions/upload-artifact@v3
        with:
          name: release-aab
          path: apps/android-client/app/build/outputs/bundle/release/*.aab

